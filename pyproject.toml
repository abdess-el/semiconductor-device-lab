[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-device-lab"
version = "1.0.0"
description = "Interactive, tested semiconductor-device lab: C-V, four-probe, probe station, BJT, op-amp, MOSFET"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abdessamad El Omary"}]

[project.urls]
Homepage = "https://github.com/abdess-el/semiconductor-device-lab"
Issues = "https://github.com/abdess-el/semiconductor-device-lab/issues"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
semilab = "semilab.cli:main"

[tool.setuptools]
packages = ["semilab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
